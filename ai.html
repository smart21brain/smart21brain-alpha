<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart21brain AI — Your learning &amp; coding assistant | Smart21Brain</title>
<meta name="description" content="Chat with Smart21brain AI: learn any subject, get coding help, write better and practise with quizzes — free, fast and made for learners.">
<link rel="canonical" href="https://smart21brain.com/ai.html">
<meta property="og:title" content="Smart21brain AI — Your learning & coding assistant">
<meta property="og:description" content="Ask anything. Learn, code, write and quiz yourself with Smart21brain AI.">
<meta property="og:type" content="website">
<link rel="icon" href="images/logo/coool.png" type="image/png">
<link rel="apple-touch-icon" href="images/logo/coool.png">
<script>
  // Same theme preference as the rest of the site (js/darkmode.js uses the 's21-theme' key).
  try { var t = localStorage.getItem('s21-theme'); document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark'); } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/ai-page.css?v=3">
<link rel="stylesheet" href="css/ai-extras.css?v=1">
</head>
<body>
<a class="skip" href="#aiInput" data-ai-t="skip">Skip to message box</a>

<div class="app" id="app">
  <!-- ============ Sidebar ============ -->
  <aside class="side" id="side" aria-label="Chats">
    <div class="side-top">
      <a class="brand" href="index.html" aria-label="Smart21Brain home">
        <img src="images/logo/coool.png" alt="" width="30" height="30">
        <span>Smart<em>21</em>brain <b>AI</b></span>
      </a>
      <button class="icon-btn only-mobile" id="sideClose" aria-label="Close menu" data-ai-t-aria="close_menu"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <button class="new-chat" id="newChat"><i class="fa-solid fa-pen-to-square"></i> <span data-ai-t="new_chat">New chat</span></button>

    <div class="search-wrap">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="search" id="chatSearch" placeholder="Search chats" data-ai-t-ph="search_chats" aria-label="Search chats" data-ai-t-aria="search_chats" autocomplete="off">
    </div>

    <nav class="history" id="history" aria-label="Chat history"></nav>

    <div class="side-bottom">
      <a href="index.html"><i class="fa-solid fa-house"></i> <span data-ai-t="home">Smart21Brain home</span></a>
      <a href="smart21code.html"><i class="fa-solid fa-laptop-code"></i> Smart21Code</a>
      <a href="smart21editor.html"><i class="fa-solid fa-code"></i> Smart21Editor</a>
      <button id="clearAll" class="link-btn"><i class="fa-regular fa-trash-can"></i> <span data-ai-t="clear_all">Clear all chats</span></button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- ============ Main ============ -->
  <main class="main">
    <header class="top">
      <button class="icon-btn" id="sideOpen" aria-label="Open menu" data-ai-t-aria="open_menu"><i class="fa-solid fa-bars"></i></button>
      <button class="icon-btn only-desktop" id="sideToggle" aria-label="Toggle sidebar" data-ai-t-aria="toggle_side"><i class="fa-solid fa-table-columns"></i></button>
      <div class="model-chip" title="Smart21brain AI"><i class="fa-solid fa-wand-magic-sparkles"></i> Smart21brain AI</div>
      <div class="top-actions">
        <button class="icon-btn" id="studyBtn" aria-label="Study tools: flashcards and quizzes" data-ai-t-aria="study_btn" title="Study" data-ai-t-title="study_btn"><i class="fa-solid fa-graduation-cap"></i></button>
        <button class="icon-btn" id="voiceBtn" aria-label="Voice chat" data-ai-t-aria="voice" title="Voice chat" data-ai-t-title="voice"><i class="fa-solid fa-headphones"></i></button>
        <button class="icon-btn" id="styleBtn" aria-label="My style" data-ai-t-aria="style_btn" title="My style" data-ai-t-title="style_btn"><i class="fa-solid fa-sliders"></i></button>
        <button class="icon-btn" id="shareBtn" aria-label="Share or copy this chat" data-ai-t-aria="share" title="Share" data-ai-t-title="share"><i class="fa-solid fa-share-nodes"></i></button>
        <button class="icon-btn" id="exportChat" aria-label="Download this chat" data-ai-t-aria="dl_chat" title="Download chat (.md)" data-ai-t-title="dl_chat_t"><i class="fa-solid fa-download"></i></button>
        <button class="icon-btn" data-lang-btn id="langBtn" aria-label="Switch language" data-ai-t-aria="switch_lang" style="font-weight:800;font-size:.72rem">SW</button>
        <button class="icon-btn" data-theme-toggle id="themeBtn" aria-label="Toggle light / dark" data-ai-t-aria="toggle_theme"><i class="fa-solid fa-sun"></i></button>
      </div>
    </header>

    <section class="stage" id="stage" aria-live="polite">
      <!-- Welcome screen -->
      <div class="welcome" id="welcome">
        <img class="w-logo" src="images/logo/coool.png" alt="Smart21brain AI" width="64" height="64">
        <h1><span id="greet">Hello</span>, <span class="grad" data-ai-t="hello_q">how can I help you today?</span></h1>
        <p class="w-sub" data-ai-t="welcome_sub">Learn any subject, get coding help, write better and test yourself.</p>
        <div class="cards" id="cards"></div>
      </div>
      <!-- Conversation -->
      <div class="thread" id="thread"></div>
    </section>

    <button class="to-bottom" id="toBottom" aria-label="Scroll to latest" data-ai-t-aria="to_bottom"><i class="fa-solid fa-arrow-down"></i></button>

    <footer class="composer-wrap">
          <div class="modes" id="modes" role="radiogroup" aria-label="Mode" data-ai-t-aria="mode_aria">
          <button type="button" role="radio" aria-checked="false" data-mode="learn"><i class="fa-solid fa-graduation-cap"></i> <span data-ai-t="mode_learn">Learn</span></button>
          <button type="button" role="radio" aria-checked="false" data-mode="code"><i class="fa-solid fa-code"></i> <span data-ai-t="mode_code">Code</span></button>
          <button type="button" role="radio" aria-checked="false" data-mode="write"><i class="fa-solid fa-feather-pointed"></i> <span data-ai-t="mode_write">Write</span></button>
          <button type="button" role="radio" aria-checked="false" data-mode="quiz"><i class="fa-solid fa-circle-question"></i> <span data-ai-t="mode_quiz">Quiz me</span></button>
          </div>
      <form class="composer" id="composer">
        <div class="att-row" id="attRow" hidden></div>
        <textarea id="aiInput" rows="1" maxlength="4000" placeholder="Message Smart21brain AI…" data-ai-t-ph="placeholder" aria-label="Message Smart21brain AI" data-ai-t-aria="placeholder"></textarea>
        <div class="c-row">
          <div class="modes modes-in" role="radiogroup" aria-label="Auto mode">
          <button type="button" role="radio" aria-checked="true"  data-mode="" class="on"><i class="fa-solid fa-bolt"></i> <span data-ai-t="mode_auto">Auto</span></button></div>
          <span class="c-tools">
            <button type="button" class="icon-btn" id="attBtn" aria-label="Attach a photo or file" data-ai-t-aria="att_add" title="Attach a photo or file" data-ai-t-title="att_add"><i class="fa-solid fa-paperclip"></i></button>
            <button type="button" class="icon-btn" id="camBtn" aria-label="Take a photo" data-ai-t-aria="att_cam" title="Take a photo" data-ai-t-title="att_cam"><i class="fa-solid fa-camera"></i></button>
            <button type="button" class="icon-btn" id="promptBtn" aria-label="Prompt ideas" data-ai-t-aria="prompts" title="Prompt ideas" data-ai-t-title="prompts"><i class="fa-regular fa-lightbulb"></i></button>
          </span>
          <span class="c-btns">
            <button type="button" class="icon-btn" id="micBtn" aria-label="Speak your question" data-ai-t-aria="mic" title="Speak" data-ai-t-title="speak"><i class="fa-solid fa-microphone"></i></button>
            <button type="submit" class="send" id="sendBtn" aria-label="Send" data-ai-t-aria="send" disabled><i class="fa-solid fa-arrow-up"></i></button>
          </span>
        </div>
        <input type="file" id="attInput" accept="image/*,.pdf,.txt,.md,.csv,.json,.html,.css,.js,.py,.java,.c,.cpp,.php,.sql" multiple hidden>
        <input type="file" id="camInput" accept="image/*" capture="environment" hidden>
      </form>
      <p class="fine" data-ai-t="fine">Smart21brain AI can make mistakes, so check important answers with your teacher.</p>
    </footer>
  </main>
</div>

<!-- HTML preview modal -->
<div class="modal" id="previewModal" hidden>
  <div class="modal-box">
    <div class="modal-head"><strong><i class="fa-solid fa-eye"></i> <span data-ai-t="preview">Preview</span></strong><button class="icon-btn" id="previewClose" aria-label="Close preview" data-ai-t-aria="close_preview"><i class="fa-solid fa-xmark"></i></button></div>
    <iframe id="previewFrame" title="Code preview" sandbox="allow-scripts"></iframe>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="js/ai-i18n.js"></script>
<script src="js/ai-render.js"></script>
<script src="js/ai-attach.js?v=1"></script>
<script src="js/ai-page.js?v=3"></script>
<script src="js/ai-extras.js?v=1"></script>
<script src="js/ai-voice.js?v=1"></script>
<script src="js/ai-study.js?v=1"></script>
</body>
</html>
